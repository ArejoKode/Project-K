<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>隨機抽獎 API 練習</title>
  <style>
    button {
      padding: 8px 14px;
      cursor: pointer;
    }

    img {
      max-width: 300px;
      border-radius: 8px;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <h1>🐱喵喵喵~來抽獎 🐱</h1>

  <button class="btn">抽起</button>

  <div class="inner">
    <h2 class="prizeText"></h2>
    <img class="prizeImg" src="" alt="">
  </div>

  <script>
    const btn = document.querySelector('.btn');
    const inner = document.querySelector('.inner');

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = "loading~";

      try {
        const res = await fetch('https://dvwhnbka7d.execute-api.us-east-1.amazonaws.com/default/lottery');
        const data = await res.json();

        let text = "";
        let imgUrl = "";

        switch (data.prize) {
          case "FIRST":
            text = '恭喜你中頭獎了！日本東京來回雙人遊！';
            imgUrl = "https://cdn.pixabay.com/photo/2019/08/01/17/53/airplane-4377867_1280.jpg";
            break;

          case "SECOND":
            text = '二獎！90 吋電視一台！';
            imgUrl = "https://cdn.pixabay.com/photo/2016/11/29/09/38/adult-1867885_1280.jpg";
            break;

          case "THIRD":
            text = '恭喜你抽中三獎：知名 YouTuber 簽名握手會入場券！';
            imgUrl = "https://cdn.pixabay.com/photo/2017/08/07/14/02/youtube-2603732_1280.jpg";
            break;

          case "NONE":
            text = '銘謝惠顧！';
            imgUrl = "https://cdn.pixabay.com/photo/2016/11/29/13/17/sad-cat-1869112_1280.jpg";
            break;
        }
        // 更新畫面
        inner.innerHTML = `
          <h2>${text}</h2>
          <img src="${imgUrl}" alt="${data.prize}">
        `;

      } catch (err) {
        console.error('錯誤:', err);
        inner.innerHTML = `<h2>發生錯誤，請稍後再試 😿</h2>`;
      } finally {
        btn.disabled = false;
        btn.textContent = "抽起";
      }
    });
  </script>

</body>

</html>
